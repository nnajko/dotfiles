general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3
}

listener {
    timeout = 300                                 # 5min
    on-timeout = pidof hyprlock || hyprlock --grace 5            # lock screen when timeout has passed
}

listener {
    timeout = 600                                 # 10min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}

# On battery: lock at 2min, screen off at 3min, suspend at 10min
listener {
    timeout = 120
    on-timeout = ~/.config/scripts/on-battery.sh && (pidof hyprlock || hyprlock --grace 5)
}

listener {
    timeout = 180
    on-timeout = ~/.config/scripts/on-battery.sh && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = ~/.config/scripts/on-battery.sh && systemctl suspend
}
